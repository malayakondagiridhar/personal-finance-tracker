name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Restore backend
        run: dotnet restore backend/PersonalFinanceTracker.slnx

      - name: Build backend
        run: dotnet build backend/PersonalFinanceTracker.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/tests/PersonalFinanceTracker.UnitTests/PersonalFinanceTracker.UnitTests.csproj --configuration Release --no-build --verbosity minimal

      - name: Run integration tests
        run: dotnet test backend/tests/PersonalFinanceTracker.IntegrationTests/PersonalFinanceTracker.IntegrationTests.csproj --configuration Release --no-build --verbosity minimal
